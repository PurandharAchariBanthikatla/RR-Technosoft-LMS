apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rr-lms-staging

resources:
  - ../../base
  - namespace.yaml

patches:
  - target:
      kind: Deployment
      name: lms-backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Deployment
      name: lms-frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: ConfigMap
      name: lms-backend-config
    patch: |-
      - op: replace
        path: /data/CORS_ORIGINS
        value: "https://staging.rrtechnosoft.com"
      - op: replace
        path: /data/SEED_DATA
        value: "true"

images:
  - name: docker.io/rrtechnosoft/lms-backend
    newTag: staging
  - name: docker.io/rrtechnosoft/lms-frontend
    newTag: staging
