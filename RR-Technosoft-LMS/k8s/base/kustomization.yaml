apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - data-stores.yaml
  - configmap.yaml
  - hpa.yaml
  - ingress.yaml
  - backup-cronjob.yaml
  # secret.example.yaml is intentionally NOT included here — real secrets
  # should be created via `kubectl create secret` / an external secrets
  # manager per environment, not committed to this base. See its header
  # comment for the exact commands.

configMapGenerator:
  - name: lms-backup-script
    files:
      - backup.sh=../../scripts/backup.sh
    options:
      disableNameSuffixHash: true

commonLabels:
  app.kubernetes.io/part-of: rr-technosoft-lms
  app.kubernetes.io/managed-by: kustomize
