# SECRET TEMPLATE — DO NOT put real credentials in this file or commit it filled in.
#
# Recommended: don't apply this file directly in a real cluster. Instead:
#   kubectl create secret generic lms-db-secrets \
#     --from-literal=POSTGRES_DB=rr_lms \
#     --from-literal=POSTGRES_USER=lms_user \
#     --from-literal=POSTGRES_PASSWORD='<generate-a-strong-secret>' \
#     --from-literal=REDIS_PASSWORD='<generate-a-strong-secret>' \
#     -n rr-lms-staging
#
#   kubectl create secret generic lms-backend-secrets \
#     --from-literal=DB_PASSWORD='<same-as-POSTGRES_PASSWORD-above>' \
#     --from-literal=JWT_SECRET='<generate-a-256-bit-random-value>' \
#     --from-literal=REDIS_PASSWORD='<same-as-above>' \
#     --from-literal=SMTP_USERNAME='' \
#     --from-literal=SMTP_PASSWORD='' \
#     --from-literal=TWILIO_ACCOUNT_SID='' \
#     --from-literal=TWILIO_AUTH_TOKEN='' \
#     --from-literal=RAZORPAY_KEY_ID='' \
#     --from-literal=RAZORPAY_KEY_SECRET='' \
#     --from-literal=RAZORPAY_WEBHOOK_SECRET='' \
#     --from-literal=AWS_ACCESS_KEY_ID='' \
#     --from-literal=AWS_SECRET_ACCESS_KEY='' \
#     --from-literal=SUPER_ADMIN_EMAIL='superadmin@rrtechnosoft.com' \
#     --from-literal=SUPER_ADMIN_PASSWORD='<generate-a-strong-secret>' \
#     -n rr-lms-staging
#
# For production, prefer an external secrets manager (Sealed Secrets, External
# Secrets Operator + AWS Secrets Manager/Vault, or SOPS) over raw `kubectl create
# secret` so credentials aren't ever typed into a shell history or CI log.
# ---- Secret: lms-db-secrets (consumed by the postgres/redis pods) ----
apiVersion: v1
kind: Secret
metadata:
  name: lms-db-secrets
type: Opaque
stringData:
  POSTGRES_DB: "rr_lms"
  POSTGRES_USER: "lms_user"
  POSTGRES_PASSWORD: "CHANGE_ME"
  REDIS_PASSWORD: "CHANGE_ME"
---
# ---- Secret: lms-backend-secrets (consumed by the backend Deployment) ----
apiVersion: v1
kind: Secret
metadata:
  name: lms-backend-secrets
type: Opaque
stringData:
  DB_PASSWORD: "CHANGE_ME"
  JWT_SECRET: "CHANGE_ME_TO_A_LONG_RANDOM_VALUE"
  REDIS_PASSWORD: "CHANGE_ME"
  SMTP_USERNAME: ""
  SMTP_PASSWORD: ""
  TWILIO_ACCOUNT_SID: ""
  TWILIO_AUTH_TOKEN: ""
  RAZORPAY_KEY_ID: ""
  RAZORPAY_KEY_SECRET: ""
  RAZORPAY_WEBHOOK_SECRET: ""
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  SUPER_ADMIN_EMAIL: "superadmin@rrtechnosoft.com"
  SUPER_ADMIN_PASSWORD: "CHANGE_ME"
