# Routes /api/* to the backend Service and everything else to the frontend
# Service. Requires an nginx ingress controller and cert-manager with a
# "letsencrypt-prod" ClusterIssuer already installed in the cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lms-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - app.rrtechnosoft.com
      secretName: lms-tls-cert
  rules:
    - host: app.rrtechnosoft.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: lms-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lms-frontend
                port:
                  number: 3000
