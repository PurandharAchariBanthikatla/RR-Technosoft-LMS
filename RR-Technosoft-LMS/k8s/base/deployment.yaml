# Backend + Frontend Deployments and their in-cluster Services.

# ---- Backend: Deployment (lms-backend) ----
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lms-backend
  labels:
    app: lms-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lms-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: lms-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/api/v1/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: backend
          image: docker.io/rrtechnosoft/lms-backend:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: lms-backend-config
            - secretRef:
                name: lms-backend-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /api/v1/actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/v1/actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/v1/actuator/health
              port: 8080
            failureThreshold: 30
            periodSeconds: 5

---
# ---- Backend: Service (ClusterIP, internal only) ----
apiVersion: v1
kind: Service
metadata:
  name: lms-backend
  labels:
    app: lms-backend
spec:
  selector:
    app: lms-backend
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP

---
# ---- Frontend: Deployment (lms-frontend) ----
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lms-frontend
  labels:
    app: lms-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lms-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: lms-frontend
    spec:
      containers:
        - name: frontend
          image: docker.io/rrtechnosoft/lms-frontend:latest
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20

---
# ---- Frontend: Service (ClusterIP, internal only) ----
apiVersion: v1
kind: Service
metadata:
  name: lms-frontend
  labels:
    app: lms-frontend
spec:
  selector:
    app: lms-frontend
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
