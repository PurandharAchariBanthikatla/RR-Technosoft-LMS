trigger:
- master

pool:
  vmImage: 'ubuntu-latest'

variables:
  imageName: 'puandhar12/frontend'
  imageTag: '$(Build.BuildId)'
  dockerfilePath: '$(Build.SourcesDirectory)/RR-Technosoft-LMS/rr-technosoft-lms/Dockerfile'
  buildContext: '$(Build.SourcesDirectory)/RR-Technosoft-LMS/rr-technosoft-lms'

steps:

# 1. Verify Dockerfile
- script: |
    echo "Checking Dockerfile..."
    ls -la "$(buildContext)"
    
    if [ ! -f "$(dockerfilePath)" ]; then
      echo "ERROR: Dockerfile not found!"
      echo "$(dockerfilePath)"
      exit 1
    fi
    
    echo "Dockerfile found successfully."
  displayName: 'Verify Frontend Dockerfile'


# 2. Build Docker Image
- task: Docker@2
  displayName: 'Build Frontend Docker Image'
  inputs:
    command: build
    repository: '$(imageName)'
    Dockerfile: '$(dockerfilePath)'
    buildContext: '$(buildContext)'
    tags: |
      $(imageTag)
      latest


# 3. Run Docker Container and Test
- script: |
    echo "Starting frontend container..."

    docker run -d \
      --name rr-technosoft-frontend \
      -p 3000:3000 \
      $(imageName):$(imageTag)

    echo "Waiting for frontend..."
    sleep 10

    echo "Container status:"
    docker ps

    echo "Testing frontend..."
    curl --fail http://localhost:3000

    echo "Frontend test successful!"
  displayName: 'Run and Test Frontend'


# 4. Remove Test Container
- script: |
    docker stop rr-technosoft-frontend
    docker rm rr-technosoft-frontend
  displayName: 'Remove Test Container'
  condition: always()


# 5. Push Image to Docker Hub
- task: Docker@2
  displayName: 'Push Frontend Image to Docker Hub'
  inputs:
    command: push
    repository: '$(imageName)'
    containerRegistry: 'purandhar-connection'
    tags: |
      $(imageTag)
      latest
