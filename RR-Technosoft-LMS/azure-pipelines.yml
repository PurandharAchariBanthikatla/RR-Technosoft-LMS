trigger:
- master

pool:
  vmImage: ubuntu-latest

variables:
  imageName: 'purandhar12/frontend'
  imageTag: '$(Build.BuildId)'

steps:

# 1. Find Dockerfile
- script: |
    echo "Searching for Dockerfile..."

    DOCKERFILE=$(find "$(Build.SourcesDirectory)/RR-Technosoft-LMS/rr-technosoft-lms" -name Dockerfile -type f | head -n 1)

    if [ -z "$DOCKERFILE" ]; then
      echo "ERROR: Dockerfile not found"
      exit 1
    fi

    echo "Dockerfile found at:"
    echo "$DOCKERFILE"

    echo "##vso[task.setvariable variable=DOCKERFILE]$DOCKERFILE"
  displayName: 'Find Frontend Dockerfile'


# 2. Build Docker Image
- task: Docker@2
  displayName: 'Build Frontend Docker Image'
  inputs:
    command: build
    repository: '$(imageName)'
    dockerfile: '$(DOCKERFILE)'
    buildContext: '$(Build.SourcesDirectory)/RR-Technosoft-LMS/rr-technosoft-lms'
    tags: |
      $(imageTag)
      latest


# 3. Run Docker Image
- script: |
    echo "Starting frontend container..."

    docker run -d \
      --name rr-technosoft-frontend \
      -p 8080:3000 \
      $(imageName):$(imageTag)

    echo "Waiting for frontend..."
    sleep 10

    echo "Container status:"
    docker ps

    echo "Testing frontend..."
    curl --fail http://localhost:8080

    echo "Frontend test successful!"
  displayName: 'Run and Test Frontend'


# 4. Remove Test Container
- script: |
    docker stop rr-technosoft-frontend
    docker rm rr-technosoft-frontend
  displayName: 'Remove Test Container'


# 5. Push Image to Docker Hub
- task: Docker@2
  displayName: 'Push Frontend Image to Docker Hub'
  inputs:
    command: push
    repository: '$(imageName)'
    containerRegistry: 'dockerhub-connection'
    tags: |
      $(imageTag)
      latest
