# RR Technosoft LMS — CI/CD pipeline (GitHub Actions)
#
# Mirrors the existing Jenkinsfile stage-for-stage so either CI system can be
# used interchangeably: backend build/test -> dependency scan -> frontend
# lint/test/build -> E2E (main/develop only) -> Docker build -> image scan ->
# push -> deploy to staging (develop) -> deploy to production (tags `v*`,
# gated behind a required GitHub Environment reviewer).
#
# Required repo secrets (Settings > Secrets and variables > Actions):
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN   — registry login for image push
#   KUBECONFIG_STAGING                    — base64-encoded kubeconfig for the staging cluster
#   KUBECONFIG_PRODUCTION                 — base64-encoded kubeconfig for the production cluster
#
# Required repo/environment setup:
#   Settings > Environments > "production" with at least one required
#   reviewer — this is what gates the Deploy to Production job, replacing
#   the Jenkinsfile's `input` approval step.

name: CI/CD

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: docker.io/rrtechnosoft
  BACKEND_IMAGE: docker.io/rrtechnosoft/lms-backend
  FRONTEND_IMAGE: docker.io/rrtechnosoft/lms-frontend

jobs:

  # ---- Backend: Build & Unit Tests ----
  backend-test:
    name: Backend / Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Compile
        working-directory: backend
        run: mvn -B -ntp clean compile

      - name: Unit tests
        working-directory: backend
        run: mvn -B -ntp test

      - name: Publish unit test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Backend Unit Test Results
          path: "backend/target/surefire-reports/*.xml"
          reporter: java-junit
          fail-on-error: false

  # ---- Backend: Integration Tests ----
  backend-integration-test:
    name: Backend / Integration Tests
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      # Testcontainers spins up its own ephemeral Postgres/Redis containers
      # for @SpringBootTest-annotated integration tests — the GitHub-hosted
      # runner already has Docker available, so no service containers or
      # extra setup are needed here (unlike a plain unit-test job).
      - name: Integration tests (Testcontainers)
        working-directory: backend
        run: mvn -B -ntp verify -DskipUnitTests=true -Pintegration-test

      - name: Publish integration test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Backend Integration Test Results
          path: "backend/target/failsafe-reports/*.xml"
          reporter: java-junit
          fail-on-error: false

  # ---- Backend: Package ----
  backend-package:
    name: Backend / Package
    runs-on: ubuntu-latest
    needs: [backend-test, backend-integration-test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Package (skip tests — already run above)
        working-directory: backend
        run: mvn -B -ntp package -DskipTests

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: lms-backend-war
          path: backend/target/lms-backend.war
          retention-days: 14

  # ---- Security: Dependency Scan ----
  dependency-scan:
    name: Security / Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Trivy `fs` mode scans the Maven/npm dependency trees for known CVEs
      # without needing images built yet — runs early so a vulnerable
      # dependency fails fast, before spending time on Docker builds/push.
      # severity-cutoff fails the job on HIGH/CRITICAL findings; drop it (or
      # widen it) to report-only instead.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table

  # ---- Frontend: Install & Lint ----
  frontend-lint:
    name: Frontend / Install & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: rr-technosoft-lms/package-lock.json

      - name: Install dependencies
        working-directory: rr-technosoft-lms
        run: npm ci

      - name: Lint
        working-directory: rr-technosoft-lms
        run: npm run lint

      - name: Type check
        working-directory: rr-technosoft-lms
        run: npx tsc --noEmit

  # ---- Frontend: Unit Tests ----
  frontend-test:
    name: Frontend / Unit Tests
    runs-on: ubuntu-latest
    needs: frontend-lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: rr-technosoft-lms/package-lock.json

      - name: Install dependencies
        working-directory: rr-technosoft-lms
        run: npm ci

      - name: Unit tests (Jest, with coverage)
        working-directory: rr-technosoft-lms
        run: npm run test -- --ci --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: rr-technosoft-lms/coverage
          retention-days: 14

  # ---- Frontend: Build ----
  frontend-build:
    name: Frontend / Build
    runs-on: ubuntu-latest
    needs: frontend-lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: rr-technosoft-lms/package-lock.json

      - name: Install dependencies
        working-directory: rr-technosoft-lms
        run: npm ci

      # Fonts are self-hosted via @fontsource-variable (bundled at npm
      # install time), so this build makes zero network calls and can't
      # hang on an external font fetch — see src/app/layout.tsx.
      - name: Production build
        working-directory: rr-technosoft-lms
        run: npm run build

  # ---- Frontend: E2E Tests ----
  frontend-e2e:
    name: Frontend / E2E Tests
    runs-on: ubuntu-latest
    needs: [frontend-test, frontend-build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: rr-technosoft-lms/package-lock.json

      - name: Install dependencies
        working-directory: rr-technosoft-lms
        run: npm ci

      - name: Install Playwright browsers
        working-directory: rr-technosoft-lms
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        working-directory: rr-technosoft-lms
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: rr-technosoft-lms/playwright-report
          retention-days: 14

  # ---- Build & Push Docker Images ----
  docker-build-push:
    name: Docker / Build, Scan & Push
    runs-on: ubuntu-latest
    needs:
      [backend-package, frontend-build, frontend-test, dependency-scan]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v')
    outputs:
      image-tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: echo "value=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (load locally for scanning)
        uses: docker/build-push-action@v6
        with:
          context: backend
          tags: ${{ env.BACKEND_IMAGE }}:${{ steps.tag.outputs.value }}
          load: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image (load locally for scanning)
        uses: docker/build-push-action@v6
        with:
          context: rr-technosoft-lms
          tags: ${{ env.FRONTEND_IMAGE }}:${{ steps.tag.outputs.value }}
          load: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # Scans the images actually built above (OS packages + app deps baked
      # into the layers), not just source — catches base-image CVEs the
      # dependency scan job can't see. Gated before push so a vulnerable
      # image never reaches the registry.
      - name: Trivy scan — backend image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ steps.tag.outputs.value }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table

      - name: Trivy scan — frontend image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ steps.tag.outputs.value }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push backend image
        run: docker push ${{ env.BACKEND_IMAGE }}:${{ steps.tag.outputs.value }}

      - name: Push frontend image
        run: docker push ${{ env.FRONTEND_IMAGE }}:${{ steps.tag.outputs.value }}

      - name: Also tag & push :latest (release tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker tag ${{ env.BACKEND_IMAGE }}:${{ steps.tag.outputs.value }} ${{ env.BACKEND_IMAGE }}:latest
          docker tag ${{ env.FRONTEND_IMAGE }}:${{ steps.tag.outputs.value }} ${{ env.FRONTEND_IMAGE }}:latest
          docker push ${{ env.BACKEND_IMAGE }}:latest
          docker push ${{ env.FRONTEND_IMAGE }}:latest

  # ---- Deploy to Staging (develop branch only) ----
  deploy-staging:
    name: Deploy / Staging
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
    steps:
      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > "$HOME/.kube/config"

      - name: Roll out
        env:
          TAG: ${{ needs.docker-build-push.outputs.image-tag }}
        run: |
          kubectl -n rr-lms-staging set image deployment/lms-backend backend=${{ env.BACKEND_IMAGE }}:$TAG
          kubectl -n rr-lms-staging set image deployment/lms-frontend frontend=${{ env.FRONTEND_IMAGE }}:$TAG
          kubectl -n rr-lms-staging rollout status deployment/lms-backend --timeout=180s
          kubectl -n rr-lms-staging rollout status deployment/lms-frontend --timeout=180s

  # ---- Deploy to Production (v* tags only, gated by the "production" ----
  # ---- GitHub Environment's required reviewer)                       ----
  deploy-production:
    name: Deploy / Production
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
    steps:
      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_PRODUCTION }}" | base64 -d > "$HOME/.kube/config"

      - name: Roll out
        env:
          TAG: ${{ needs.docker-build-push.outputs.image-tag }}
        run: |
          kubectl -n rr-lms-prod set image deployment/lms-backend backend=${{ env.BACKEND_IMAGE }}:$TAG
          kubectl -n rr-lms-prod set image deployment/lms-frontend frontend=${{ env.FRONTEND_IMAGE }}:$TAG
          kubectl -n rr-lms-prod rollout status deployment/lms-backend --timeout=300s
          kubectl -n rr-lms-prod rollout status deployment/lms-frontend --timeout=300s
